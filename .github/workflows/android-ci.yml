name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: composeuikit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build library
        run: ./gradlew :composeuikit:assembleRelease

      - name: Run unit tests
        run: ./gradlew :composeuikit:test

      - name: Run Android lint
        run: ./gradlew :composeuikit:lint

      - name: Build sample app
        run: ./gradlew :sample:assembleDebug

      - name: Upload sample APK for screenshot capture
        uses: actions/upload-artifact@v7
        with:
          name: composeuikit-sample-debug-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Compile sample UI tests
        run: ./gradlew :sample:assembleDebugAndroidTest

      - name: Verify Maven publication
        run: ./gradlew :composeuikit:publishReleasePublicationToLocalRepository

  capture-screenshots:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[capture-screenshots]'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download sample APK
        uses: actions/download-artifact@v7
        with:
          name: composeuikit-sample-debug-apk
          path: artifacts

      - name: Capture sample app screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r artifacts/sample-debug.apk
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell am start -n dev.tauseef.composeuikit.sample/.MainActivity
            sleep 5
            mkdir -p docs/assets/screenshots
            adb exec-out screencap -p > docs/assets/screenshots/component-overview.png
            adb shell input swipe 540 2050 540 600 450
            sleep 2
            adb exec-out screencap -p > docs/assets/screenshots/forms-and-selection.png

      - name: Mark screenshot roadmap item complete
        run: |
          sed -i 's/- \[ \] Capture real emulator screenshots for README/- [x] Capture real emulator screenshots for README/' README.md

      - name: Commit emulator screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots README.md
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "docs: add Android emulator screenshots"
            git push
          fi
