name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: composeuikit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build library
        run: ./gradlew :composeuikit:assembleRelease

      - name: Run unit tests
        run: ./gradlew :composeuikit:test

      - name: Run Android lint
        run: ./gradlew :composeuikit:lint

      - name: Build sample app
        run: ./gradlew :sample:assembleDebug

      - name: Compile sample UI tests
        run: ./gradlew :sample:assembleDebugAndroidTest

      - name: Verify Maven publication
        run: ./gradlew :composeuikit:publishReleasePublicationToLocalRepository
