name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: composeuikit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and lint library and sample
        run: |
          ./gradlew :composeuikit:assembleRelease
          ./gradlew :composeuikit:test
          ./gradlew :composeuikit:lint
          ./gradlew :sample:assembleDebug
          ./gradlew :sample:assembleDebugAndroidTest
          ./gradlew :composeuikit:publishReleasePublicationToLocalRepository

      - name: Generate public API snapshot
        run: ./gradlew apiDump

      - name: Upload API snapshot for review
        uses: actions/upload-artifact@v7
        with:
          name: composeuikit-api-snapshot
          path: api/**/*.api
          if-no-files-found: error
          retention-days: 7

  android-emulator-validation:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CAPTURE_SCREENSHOTS: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[capture-screenshots]'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run sample UI tests and capture README screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :sample:connectedDebugAndroidTest :sample:assembleDebug
            if [ "$CAPTURE_SCREENSHOTS" = "true" ]; then
              adb shell wm size 1080x2400
              adb shell wm density 420
              adb shell settings put system font_scale 1.0
              adb shell wm dismiss-keyguard
              adb install -r sample/build/outputs/apk/debug/sample-debug.apk
              adb shell am force-stop dev.tauseef.composeuikit.sample
              adb shell am start -W -n dev.tauseef.composeuikit.sample/.MainActivity
              sleep 2
              mkdir -p docs/assets/screenshots
              adb exec-out screencap -p > docs/assets/screenshots/component-overview.png
              adb shell input swipe 540 2050 540 600 450
              sleep 2
              adb exec-out screencap -p > docs/assets/screenshots/forms-and-selection.png
              test -s docs/assets/screenshots/component-overview.png
              test -s docs/assets/screenshots/forms-and-selection.png
            fi

      - name: Commit emulator screenshots
        if: env.CAPTURE_SCREENSHOTS == 'true'
        run: |
          sed -i 's/- \[ \] Capture real emulator screenshots for README/- [x] Capture real emulator screenshots for README/' README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots README.md
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "docs: add Android emulator screenshots [skip ci]"
            git push origin HEAD:main
          fi
