name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: composeuikit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test, lint, publish locally and validate API
        run: |
          ./gradlew --build-cache --parallel \
            :composeuikit:assembleRelease \
            :composeuikit:test \
            :composeuikit:lint \
            :sample:assembleDebug \
            :sample:assembleDebugAndroidTest \
            :composeuikit:publishReleasePublicationToLocalRepository \
            apiCheck

      - name: Upload committed API baseline for review
        uses: actions/upload-artifact@v7
        with:
          name: composeuikit-api-baseline
          path: composeuikit/api/composeuikit.api
          if-no-files-found: error
          retention-days: 7

  android-emulator-validation:
    # Run the expensive device suite once on main (or on explicit manual dispatch),
    # not again on every PR. PRs still compile the instrumentation APK in the build job.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CAPTURE_SCREENSHOTS: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[capture-screenshots]'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run sample UI tests and capture README screenshots
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-emulator-validation.sh

      - name: Upload emulator screenshots
        if: env.CAPTURE_SCREENSHOTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: composeuikit-readme-screenshots
          path: docs/assets/screenshots/*.png
          if-no-files-found: error
          retention-days: 1
