name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: composeuikit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build library
        run: gradle :composeuikit:assembleRelease

      - name: Run unit tests
        run: gradle :composeuikit:test

      - name: Run Android lint
        run: gradle :composeuikit:lint

      - name: Build sample app
        run: gradle :sample:assembleDebug

      - name: Compile sample UI tests
        run: gradle :sample:assembleDebugAndroidTest

      - name: Verify Maven publication
        run: gradle :composeuikit:publishReleasePublicationToLocalRepository
