name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: composeuikit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test, lint, publish locally and validate API
        run: |
          ./gradlew --build-cache --parallel \
            :composeuikit:assembleRelease \
            :composeuikit:test \
            :composeuikit:lint \
            :sample:assembleDebug \
            :composeuikit:publishReleasePublicationToLocalRepository \
            apiCheck

      - name: Upload committed API baseline for review
        uses: actions/upload-artifact@v7
        with:
          name: composeuikit-api-baseline
          path: composeuikit/api/composeuikit.api
          if-no-files-found: error
          retention-days: 7

