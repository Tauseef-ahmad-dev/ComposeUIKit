name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches project version
        shell: bash
        run: |
          PROJECT_VERSION=$(./gradlew -q properties | awk '/^version:/ { print $2; exit }')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Gradle version $PROJECT_VERSION."
            exit 1
          fi

      - name: Validate API and build release artifacts
        run: |
          ./gradlew apiCheck
          ./gradlew :composeuikit:assembleRelease
          ./gradlew :composeuikit:test
          ./gradlew :composeuikit:lint
          ./gradlew :sample:assembleDebug
          ./gradlew :composeuikit:publishMavenPublicationToLocalRepository

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE="composeuikit/build/repo/io/github/tauseef-ahmad-dev/composeuikit/$VERSION"
          REQUIRED_ASSETS=(
            "composeuikit-$VERSION.aar"
            "composeuikit-$VERSION-sources.jar"
            "composeuikit-$VERSION.pom"
            "composeuikit-$VERSION.module"
          )

          test -d "$SOURCE"
          mkdir -p release-assets
          for asset in "${REQUIRED_ASSETS[@]}"; do
            test -f "$SOURCE/$asset"
            cp "$SOURCE/$asset" release-assets/
          done

          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq "${#REQUIRED_ASSETS[@]}"
          ls -lah release-assets

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "ComposeUIKit $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
