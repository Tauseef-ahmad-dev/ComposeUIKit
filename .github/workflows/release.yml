name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches project version
        shell: bash
        run: |
          PROJECT_VERSION=$(./gradlew -q properties | awk '/^version:/ { print $2; exit }')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Gradle version $PROJECT_VERSION."
            exit 1
          fi

      - name: Validate API and build release artifacts
        run: |
          ./gradlew apiCheck
          ./gradlew :composeuikit:assembleRelease
          ./gradlew :composeuikit:test
          ./gradlew :composeuikit:lint
          ./gradlew :sample:assembleDebugAndroidTest
          ./gradlew :composeuikit:publishReleasePublicationToLocalRepository

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE="composeuikit/build/repo/dev/tauseef/composeuikit/$VERSION"
          test -d "$SOURCE"
          mkdir -p release-assets
          cp "$SOURCE"/* release-assets/
          ls -lah release-assets

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "ComposeUIKit $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
