  <rect x="320" y="465" width="510" height="290" rx="16" fill="#151f30" stroke="#2b3a52" filter="url(#shadow)"/>
  <text x="350" y="505" fill="#f2f5fd" font-family="Arial,sans-serif" font-size="18" font-weight="700">Selection controls</text>
  <text x="350" y="528" fill="#8190a9" font-family="Arial,sans-serif" font-size="11">Dropdown · Filter chips · Checkbox · Radio</text>
  <rect x="350" y="552" width="450" height="52" rx="8" fill="#101827" stroke="#3b4e70"/>
  <text x="369" y="584" fill="#dce5f7" font-family="Arial,sans-serif" font-size="12">Choose a category</text><path d="M771 573l8 8 8-8" fill="none" stroke="#9aabc8" stroke-width="2"/>
  <rect x="350" y="625" width="74" height="31" rx="16" fill="#6789ff"/><text x="371" y="645" fill="#081327" font-family="Arial,sans-serif" font-size="11" font-weight="700">All</text>
  <rect x="435" y="625" width="86" height="31" rx="16" fill="#202e46" stroke="#415779"/><text x="454" y="645" fill="#cad6ee" font-family="Arial,sans-serif" font-size="11">Active</text>
  <rect x="532" y="625" width="100" height="31" rx="16" fill="#202e46" stroke="#415779"/><text x="551" y="645" fill="#cad6ee" font-family="Arial,sans-serif" font-size="11">Archived</text>
  <rect x="352" y="683" width="18" height="18" rx="4" fill="#6789ff"/><path d="M356 692l4 4 7-8" stroke="#081327" stroke-width="2" fill="none"/>
  <text x="382" y="697" fill="#d3def2" font-family="Arial,sans-serif" font-size="12">Enable notifications</text>
  <circle cx="550" cy="692" r="9" fill="none" stroke="#7e92b8" stroke-width="2"/>
  <circle cx="550" cy="692" r="4" fill="#7e92b8"/>
  <text x="570" y="697" fill="#d3def2" font-family="Arial,sans-serif" font-size="12">Email</text>

  <!-- Feedback card -->
  <rect x="855" y="600" width="525" height="155" rx="16" fill="#151f30" stroke="#2b3a52" filter="url(#shadow)"/>
  <text x="885" y="640" fill="#f2f5fd" font-family="Arial,sans-serif" font-size="18" font-weight="700">Feedback and states</text>
  <circle cx="911" cy="688" r="13" fill="none" stroke="#8da7ff" stroke-width="3"/><path d="M911 675 A13 13 0 0 1 924 688" stroke="#dce6ff" stroke-width="3" fill="none"/>
  <text x="938" y="684" fill="#dce5f7" font-family="Arial,sans-serif" font-size="12">Loading</text><text x="938" y="701" fill="#8392ad" font-family="Arial,sans-serif" font-size="10">Circular progress indicator</text>
  <rect x="1120" y="667" width="225" height="54" rx="9" fill="#223652" stroke="#405a82"/>
  <text x="1137" y="689" fill="#e5edff" font-family="Arial,sans-serif" font-size="11">Changes saved successfully</text>
  <text x="1137" y="706" fill="#8fa8db" font-family="Arial,sans-serif" font-size="10">SNACKBAR PREVIEW</text>

  <text x="320" y="845" fill="#6e7e99" font-family="Arial,sans-serif" font-size="11">KOTLIN  ·  JETPACK COMPOSE  ·  MATERIAL 3</text>
  <text x="1380" y="845" fill="#6e7e99" font-family="Arial,sans-serif" font-size="11" text-anchor="end">ILLUSTRATIVE PREVIEW · NOT AN EMULATOR CAPTURE</text>
  <rect x="320" y="875" width="1060" height="1" fill="#27364e"/>
  <text x="320" y="908" fill="#9eabc1" font-family="Arial,sans-serif" font-size="11">ComposeUIKit · Reusable UI building blocks for Android teams</text>
  <text x="1380" y="908" fill="#8392ad" font-family="Arial,sans-serif" font-size="11" text-anchor="end">Tauseef Ahmad</text>
</svg>