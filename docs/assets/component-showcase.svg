<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ComposeUIKit component showcase preview</title>
  <desc id="desc">Illustrative dark interface showing reusable buttons, inputs, selection controls, and feedback components in a component gallery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8da7ff"/><stop offset="1" stop-color="#5479f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1440" height="960" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="270" height="960" fill="#0d1524"/>
  <path d="M270 0V960" stroke="#26334a"/>
  <text x="42" y="62" fill="#f4f7ff" font-family="Arial,sans-serif" font-weight="700" font-size="25">ComposeUIKit<tspan fill="#91a8ff">.</tspan></text>
  <text x="42" y="92" fill="#71809c" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">COMPONENT PLAYGROUND</text>
  <text x="42" y="151" fill="#687894" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">FOUNDATION</text>
  <rect x="24" y="170" width="220" height="43" rx="8" fill="#1d2b46"/>
  <rect x="24" y="170" width="3" height="43" rx="2" fill="#8da7ff"/>
  <text x="48" y="197" fill="#f1f5ff" font-family="Arial,sans-serif" font-size="14">Overview</text>
  <text x="48" y="252" fill="#9aa8c0" font-family="Arial,sans-serif" font-size="14">Buttons</text>
  <text x="48" y="296" fill="#9aa8c0" font-family="Arial,sans-serif" font-size="14">Inputs</text>
  <text x="48" y="340" fill="#9aa8c0" font-family="Arial,sans-serif" font-size="14">Selection</text>
  <text x="48" y="384" fill="#9aa8c0" font-family="Arial,sans-serif" font-size="14">Feedback</text>
  <text x="48" y="428" fill="#9aa8c0" font-family="Arial,sans-serif" font-size="14">Layout</text>
  <rect x="24" y="870" width="220" height="54" rx="10" fill="#141f32" stroke="#2b3a56"/>
  <circle cx="52" cy="897" r="13" fill="#2b3f68"/><text x="48" y="902" fill="#cbd7f2" font-family="Arial,sans-serif" font-weight="700" font-size="12">T</text>
  <text x="76" y="894" fill="#e6ecfa" font-family="Arial,sans-serif" font-size="12" font-weight="700">ComposeUIKit</text>
  <text x="76" y="910" fill="#7e8da8" font-family="Arial,sans-serif" font-size="10">v0.1.0 · Preview</text>

  <text x="320" y="72" fill="#91a8ff" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">DESIGN SYSTEM / COMPONENTS</text>
  <text x="320" y="128" fill="#f4f7ff" font-family="Arial,sans-serif" font-size="38" font-weight="700">Build consistent experiences.</text>
  <text x="320" y="160" fill="#96a4bd" font-family="Arial,sans-serif" font-size="15">Reusable Material 3 components, designed for real Android apps.</text>
  <rect x="1190" y="55" width="190" height="38" rx="19" fill="#17253b" stroke="#304362"/>
  <circle cx="1210" cy="74" r="5" fill="#53d6a4"/><text x="1224" y="78" fill="#cbd6ec" font-family="Arial,sans-serif" font-size="11">INTERACTIVE SAMPLE</text>
  
