  <rect x="855" y="210" width="525" height="370" rx="16" fill="#151f30" stroke="#2b3a52" filter="url(#shadow)"/>
  <text x="885" y="250" fill="#f2f5fd" font-family="Arial,sans-serif" font-size="18" font-weight="700">Inputs</text>
  <text x="885" y="273" fill="#8190a9" font-family="Arial,sans-serif" font-size="11">State hoisting · Helper text · Validation</text>
  <text x="885" y="315" fill="#aebbd1" font-family="Arial,sans-serif" font-size="10">FULL NAME</text>
  <rect x="885" y="326" width="465" height="54" rx="8" fill="#101827" stroke="#526b9c"/>
  <text x="904" y="359" fill="#e0e8f8" font-family="Arial,sans-serif" font-size="13">Tauseef Ahmad</text>
  <text x="885" y="399" fill="#8898b5" font-family="Arial,sans-serif" font-size="10">This is a controlled input with supporting text.</text>
  <text x="885" y="437" fill="#aebbd1" font-family="Arial,sans-serif" font-size="10">EMAIL ADDRESS · ERROR STATE</text>
  <rect x="885" y="448" width="465" height="54" rx="8" fill="#101827" stroke="#d36f73"/>
  <text x="904" y="481" fill="#e0e8f8" font-family="Arial,sans-serif" font-size="13">not-an-email</text>
  <text x="885" y="522" fill="#ee8f94" font-family="Arial,sans-serif" font-size="10">Enter a valid email address.</text>
  <rect x="885" y="540" width="465" height="1" fill="#293950"/>

