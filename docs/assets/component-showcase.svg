  <rect x="320" y="210" width="510" height="230" rx="16" fill="#151f30" stroke="#2b3a52" filter="url(#shadow)"/>
  <text x="350" y="250" fill="#f2f5fd" font-family="Arial,sans-serif" font-size="18" font-weight="700">Buttons</text>
